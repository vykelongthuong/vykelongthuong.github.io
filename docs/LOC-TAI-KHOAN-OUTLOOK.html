<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Lọc Tài Khoản & Mật Khẩu</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../assets/js/shared.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-2: #f1f5f9;
            --panel-soft: #f8fafc;
            --text: #1e293b;
            --text-strong: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --primary: #4f46e5;
            --primary-2: #4338ca;
            --accent-emerald-bg: #ecfdf5;
            --accent-emerald-border: #d1fae5;
            --accent-emerald-text: #047857;
            --accent-emerald-strong: #064e3b;
            --accent-rose-bg: #fff1f2;
            --accent-rose-border: #ffe4e6;
            --accent-rose-text: #be123c;
            --accent-rose-strong: #881337;
            --scroll-track: #f1f5f9;
            --scroll-thumb: #cbd5e1;
            --scroll-thumb-hover: #94a3b8;
        }

        body[data-theme="dark"] {
            --bg: #0f1220;
            --panel: #171b2d;
            --panel-2: #20263a;
            --panel-soft: #1b2036;
            --text: #eef2ff;
            --text-strong: #ffffff;
            --muted: #a7b0c6;
            --border: #2d354d;
            --border-strong: #3a4566;
            --primary: #8b8bff;
            --primary-2: #b2b2ff;
            --accent-emerald-bg: rgba(16, 185, 129, 0.12);
            --accent-emerald-border: rgba(16, 185, 129, 0.35);
            --accent-emerald-text: #6ee7b7;
            --accent-emerald-strong: #a7f3d0;
            --accent-rose-bg: rgba(244, 63, 94, 0.12);
            --accent-rose-border: rgba(244, 63, 94, 0.35);
            --accent-rose-text: #fda4af;
            --accent-rose-strong: #fecdd3;
            --scroll-track: #20263a;
            --scroll-thumb: #3a4566;
            --scroll-thumb-hover: #4a5680;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background-color .25s ease, color .25s ease;
        }

        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track {
            background: var(--scroll-track);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

        .bg-white { background-color: var(--panel) !important; }
        .bg-slate-50 { background-color: var(--bg) !important; }
        body .border-slate-100,
        body .border-slate-200 { border-color: var(--border) !important; }

        #input-data {
            background-color: var(--panel-soft) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        #input-data::placeholder { color: var(--muted) !important; opacity: 1; }

        body .text-slate-800,
        body .text-slate-900 { color: var(--text-strong) !important; }
        body .text-slate-500,
        body .text-slate-400,
        body .text-slate-600 { color: var(--muted) !important; }
        body .text-slate-200 { color: var(--border-strong) !important; }

        body[data-theme="dark"] #input-count {
            background-color: var(--panel-2) !important;
            color: var(--muted) !important;
        }
        body[data-theme="dark"] .bg-blue-100 { background-color: rgba(139, 139, 255, 0.18) !important; }
        body[data-theme="dark"] .text-blue-600,
        body[data-theme="dark"] .text-indigo-600 { color: var(--primary-2) !important; }

        .result-card {
            background-color: var(--panel) !important;
            border-color: var(--border) !important;
        }
        .result-card .btn-copy-user {
            background-color: var(--panel) !important;
            border-color: var(--accent-emerald-border) !important;
            color: var(--accent-emerald-text) !important;
        }
        .result-card .btn-copy-pass {
            background-color: var(--panel) !important;
            border-color: var(--accent-rose-border) !important;
            color: var(--accent-rose-text) !important;
        }

        body[data-theme="dark"] .result-card .status-pill {
            background-color: var(--panel-2) !important;
            color: var(--muted) !important;
        }
        body[data-theme="dark"] .result-card .status-divider { border-color: var(--border) !important; }
        body[data-theme="dark"] .result-card.is-done {
            background-color: rgba(16, 185, 129, 0.10) !important;
            border-color: rgba(16, 185, 129, 0.45) !important;
        }
        body[data-theme="dark"] .result-card.is-done .status-pill {
            background-color: #10b981 !important;
            color: #052e1f !important;
        }
        body[data-theme="dark"] .result-card.is-done .status-text-done { color: #6ee7b7 !important; }

        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary-2);
        }

        @keyframes toastSlideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toastSlideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
        .toast-enter { animation: toastSlideIn 0.3s ease forwards; }
        .toast-exit { animation: toastSlideOut 0.3s ease forwards; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-slate-900">Trình Lọc Dữ Liệu Tài Khoản</h1>
                </div>
                <p class="text-slate-500 text-sm mt-1">Tự động trích xuất Tên tài khoản và Mật khẩu từ chuỗi dữ liệu phức tạp.</p>
            </div>
            <button id="themeBtn" type="button" class="theme-toggle">Đổi theme</button>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Input Column -->
            <div class="flex flex-col gap-4">
                <div class="bg-white rounded-xl border border-slate-100 shadow-sm p-4 flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="font-semibold text-slate-800">Dữ liệu đầu vào:</label>
                        <span id="input-count" class="text-sm font-mono px-2 py-1 rounded-md bg-blue-50 text-blue-600 font-medium">
                            0 dòng
                        </span>
                    </div>
                    <textarea id="input-data" placeholder="Dán dữ liệu của bạn vào đây..."
                        class="w-full h-64 p-3 rounded-lg border border-slate-200 outline-none resize-none text-sm"></textarea>
                </div>
            </div>

            <!-- Results Column -->
            <div class="flex flex-col">
                <div class="flex justify-between items-end mb-3">
                    <label class="font-semibold text-slate-800">Kết quả đã lọc:</label>
                    <button id="btn-copy-all" class="flex items-center gap-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-lg transition-colors">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                        Chép tất cả
                    </button>
                </div>
                <div id="results-container" class="flex flex-col gap-2 max-h-[70vh] overflow-y-auto"></div>
            </div>

        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // DOM elements
        const inputArea = document.getElementById('input-data');
        const resultsContainer = document.getElementById('results-container');
        const inputCountBadge = document.getElementById('input-count');
        const btnCopyAll = document.getElementById('btn-copy-all');

        // Global state
        let currentProcessedData = [];

        function processData() {
            const rawText = inputArea.value.trim();
            if (!rawText) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <svg class="w-12 h-12 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                        <p class="text-sm">Dán dữ liệu để bắt đầu lọc</p>
                    </div>`;
                inputCountBadge.textContent = "0 dòng";
                currentProcessedData = [];
                return;
            }

            const lines = rawText.split('\n');
            inputCountBadge.textContent = `${lines.length} dòng`;
            
            const results = [];
            const passwordRegex = /[A-Za-z0-9]{8,30}/;
            const emailRegex = /[\w\.-]+@[\w\.-]+\.\w+/;

            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed || trimmed.length < 6) return;

                let email = '';
                const emailMatch = trimmed.match(emailRegex);
                if (emailMatch) email = emailMatch[0];

                let password = '';
                const parts = trimmed.split(/[:\s|]+/);
                
                if (parts.length === 2 && parts[0].includes('@')) {
                    email = parts[0];
                    password = parts[1];
                } else {
                    for (const part of parts) {
                        if (!email && part.includes('@')) {
                            email = part;
                        } else if (!password && passwordRegex.test(part) && !part.includes('@') && part.length >= 8) {
                            password = part;
                        }
                    }
                }

                if (email && password) {
                    results.push({ email, password, originalLine: line, index: idx });
                }
            });

            currentProcessedData = results;

            if (results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <svg class="w-12 h-12 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M12 20a8 8 0 100-16 8 8 0 000 16z" /></svg>
                        <p class="text-sm">Không tìm thấy dữ liệu hợp lệ</p>
                    </div>`;
                return;
            }

            resultsContainer.innerHTML = results.map((item, idx) => {
                const rowId = `row-${idx}`;
                return `
                <div id="${rowId}" class="result-card p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <span class="text-sm font-semibold text-slate-900 block truncate">${item.email}</span>
                            <span class="text-xs text-slate-500 block truncate">${item.password}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="status-pill flex items-center gap-1.5 px-2 py-1 rounded-full bg-slate-100">
                                <span class="status-icon w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center">
                                    <svg class="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </span>
                                <span class="status-text text-xs text-slate-500">Chưa chép</span>
                            </div>
                            <button onclick="copySpecific('${item.email}', this, '${rowId}', 'user')" class="btn-copy-user px-3 py-1.5 rounded-lg border text-xs font-medium flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                User
                            </button>
                            <button onclick="copySpecific('${item.password}', this, '${rowId}', 'pass')" class="btn-copy-pass px-3 py-1.5 rounded-lg border text-xs font-medium flex items-center gap-1">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                                Pass
                            </button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        inputArea.addEventListener('input', processData);

        btnCopyAll.addEventListener('click', () => {
            if (currentProcessedData.length === 0) {
                showToast("Không có dữ liệu để sao chép!", "error");
                return;
            }

            const formatted = currentProcessedData.map(d => `${d.email}|${d.password}`).join('\n');
            const temp = document.createElement('textarea');
            temp.value = formatted;
            document.body.appendChild(temp);
            temp.select();

            try {
                document.execCommand('copy');
                showToast(`Đã sao chép tất cả ${currentProcessedData.length} tài khoản!`, "success");
                
                const btn = document.getElementById('btn-copy-all');
                const originalText = btn.innerHTML;
                btn.innerHTML = `
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    Đã sao chép tất cả!
                `;
                btn.classList.replace('bg-indigo-600', 'bg-slate-800');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-slate-800', 'bg-indigo-600');
                }, 2000);
            } catch (err) {
                showToast("Lỗi sao chép!", "error");
            }
            document.body.removeChild(temp);
        });

        function copySpecific(text, button, rowId, type) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            
            try {
                document.execCommand('copy');
                showToast(`Đã chép ${type === 'user' ? 'Tài khoản' : 'Mật khẩu'}!`, "success");
            } catch (err) {
                showToast("Lỗi sao chép!", "error");
            }
            document.body.removeChild(temp);

            const originalText = button.textContent;
            button.textContent = 'Đã chép';
            button.classList.add('bg-slate-800', 'text-white', 'border-slate-800');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('bg-slate-800', 'text-white', 'border-slate-800');
            }, 1500);

            const row = document.getElementById(rowId);
            if (row) {
                if (type === 'user') row.dataset.userCopied = 'true';
                if (type === 'pass') row.dataset.passCopied = 'true';

                if (row.dataset.userCopied === 'true' && row.dataset.passCopied === 'true') {
                    row.classList.add('bg-green-50', 'border-green-300');
                    const icon = row.querySelector('.status-icon');
                    const textNode = row.querySelector('.status-text');
                    icon.classList.replace('bg-slate-100', 'bg-green-500');
                    icon.classList.replace('text-slate-400', 'text-white');
                    icon.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
                    textNode.textContent = "Hoàn tất";
                    textNode.classList.replace('text-slate-500', 'text-green-700');
                    textNode.classList.add('font-bold');
                }
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-800' : 'bg-red-600';
            
            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium ${bgColor}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ========== THEME ==========
        DocHub.initTheme([document.getElementById('themeBtn')]);

        processData();
    </script>
</body>
</html>

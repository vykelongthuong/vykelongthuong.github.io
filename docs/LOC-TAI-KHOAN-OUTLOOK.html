<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Lọc Tài Khoản & Mật Khẩu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --panel: #ffffff;
            --panel-2: #f1f5f9;
            --panel-soft: #f8fafc;
            --text: #1e293b;
            --text-strong: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --border-strong: #cbd5e1;
            --primary: #4f46e5;
            --primary-2: #4338ca;
            --accent-emerald-bg: #ecfdf5;
            --accent-emerald-border: #d1fae5;
            --accent-emerald-text: #047857;
            --accent-emerald-strong: #064e3b;
            --accent-rose-bg: #fff1f2;
            --accent-rose-border: #ffe4e6;
            --accent-rose-text: #be123c;
            --accent-rose-strong: #881337;
            --scroll-track: #f1f5f9;
            --scroll-thumb: #cbd5e1;
            --scroll-thumb-hover: #94a3b8;
        }

        body[data-theme="dark"] {
            --bg: #0f1220;
            --panel: #171b2d;
            --panel-2: #20263a;
            --panel-soft: #1b2036;
            --text: #eef2ff;
            --text-strong: #ffffff;
            --muted: #a7b0c6;
            --border: #2d354d;
            --border-strong: #3a4566;
            --primary: #8b8bff;
            --primary-2: #b2b2ff;
            --accent-emerald-bg: rgba(16, 185, 129, 0.12);
            --accent-emerald-border: rgba(16, 185, 129, 0.35);
            --accent-emerald-text: #6ee7b7;
            --accent-emerald-strong: #a7f3d0;
            --accent-rose-bg: rgba(244, 63, 94, 0.12);
            --accent-rose-border: rgba(244, 63, 94, 0.35);
            --accent-rose-text: #fda4af;
            --accent-rose-strong: #fecdd3;
            --scroll-track: #20263a;
            --scroll-thumb: #3a4566;
            --scroll-thumb-hover: #4a5680;
        }

        body {
            background: var(--bg);
            color: var(--text);
            transition: background-color .25s ease, color .25s ease;
        }

        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track {
            background: var(--scroll-track);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

        .bg-white { background-color: var(--panel) !important; }
        .bg-slate-50 { background-color: var(--bg) !important; }
        body .border-slate-100,
        body .border-slate-200 { border-color: var(--border) !important; }

        #input-data {
            background-color: var(--panel-soft) !important;
            border-color: var(--border) !important;
            color: var(--text) !important;
        }
        #input-data::placeholder { color: var(--muted) !important; opacity: 1; }

        body .text-slate-800,
        body .text-slate-900 { color: var(--text-strong) !important; }
        body .text-slate-500,
        body .text-slate-400,
        body .text-slate-600 { color: var(--muted) !important; }
        body .text-slate-200 { color: var(--border-strong) !important; }

        body[data-theme="dark"] #input-count {
            background-color: var(--panel-2) !important;
            color: var(--muted) !important;
        }
        body[data-theme="dark"] .bg-blue-100 { background-color: rgba(139, 139, 255, 0.18) !important; }
        body[data-theme="dark"] .text-blue-600,
        body[data-theme="dark"] .text-indigo-600 { color: var(--primary-2) !important; }

        .result-card {
            background-color: var(--panel) !important;
            border-color: var(--border) !important;
        }
        .result-card .field-user {
            background-color: var(--accent-emerald-bg) !important;
            border-color: var(--accent-emerald-border) !important;
        }
        .result-card .field-pass {
            background-color: var(--accent-rose-bg) !important;
            border-color: var(--accent-rose-border) !important;
        }
        .result-card .label-user { color: var(--accent-emerald-text) !important; }
        .result-card .label-pass { color: var(--accent-rose-text) !important; }
        .result-card .value-user { color: var(--accent-emerald-strong) !important; }
        .result-card .value-pass { color: var(--accent-rose-strong) !important; }
        .result-card .btn-copy-user {
            background-color: var(--panel) !important;
            border-color: var(--accent-emerald-border) !important;
            color: var(--accent-emerald-text) !important;
        }
        .result-card .btn-copy-pass {
            background-color: var(--panel) !important;
            border-color: var(--accent-rose-border) !important;
            color: var(--accent-rose-text) !important;
        }
        body[data-theme="dark"] .result-card .status-pill {
            background-color: var(--panel-2) !important;
            color: var(--muted) !important;
        }
        body[data-theme="dark"] .result-card .status-divider { border-color: var(--border) !important; }
        body[data-theme="dark"] .result-card.is-done {
            background-color: rgba(16, 185, 129, 0.10) !important;
            border-color: rgba(16, 185, 129, 0.45) !important;
        }
        body[data-theme="dark"] .result-card.is-done .status-pill {
            background-color: #10b981 !important;
            color: #052e1f !important;
        }
        body[data-theme="dark"] .result-card.is-done .status-text-done { color: #6ee7b7 !important; }

        .theme-toggle {
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--text);
            border-radius: 10px;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all .2s ease;
        }
        .theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary-2);
        }

        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans p-4 md:p-8">

    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-4 flex-wrap">
            <div class="flex items-center gap-4">
                <div class="bg-blue-100 text-blue-600 p-3 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Trình Lọc Dữ Liệu Tài Khoản</h1>
                    <p class="text-slate-500 text-sm mt-1">Tự động trích xuất Tên tài khoản và Mật khẩu từ chuỗi dữ liệu phức tạp.</p>
                </div>
            </div>
            <button id="themeBtn" type="button" class="theme-toggle">Đổi theme</button>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Input Section -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-full">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="font-semibold text-lg flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Dữ liệu gốc (Dán vào đây)
                    </h2>
                    <span id="input-count" class="text-xs font-medium bg-slate-100 text-slate-600 py-1 px-2 rounded-lg">0 dòng</span>
                </div>
                <textarea id="input-data" 
                    class="w-full flex-grow min-h-[400px] p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none text-sm font-mono leading-relaxed transition-all" 
                    placeholder="Ví dụ:&#10;rohankochewaf@hotmail.com|DNjBpsj1K2|M.C554_BAY...&#10;user2@email.com|Pass123|DataRác..."></textarea>
                <div class="mt-3 text-xs text-slate-400 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Hệ thống tự động xử lý ngay khi bạn dán dữ liệu.
                </div>
            </div>

            <!-- Output Section -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col lg:h-[calc(100vh-12rem)] min-h-[500px]">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-3 shrink-0">
                    <h2 class="font-semibold text-lg text-slate-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
                        </svg>
                        Danh sách Kết quả
                    </h2>
                    <button onclick="copyAllFormatted()" id="btn-copy-all" class="w-full sm:w-auto text-sm bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-4 rounded-xl font-bold transition-all shadow-md flex items-center justify-center gap-2 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Sao chép tất cả (User|Pass)
                    </button>
                </div>
                
                <div id="output-list" class="flex-grow overflow-y-auto space-y-3 pr-2">
                    <div class="text-center text-slate-400 py-10 text-sm flex flex-col items-center gap-2">
                        <svg class="w-10 h-10 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                        Chưa có dữ liệu. Hãy dán dữ liệu vào ô bên trái.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <script>
        // ========== THEME ==========
        (function() {
            var stored = localStorage.getItem('ecc-guide-theme');
            if (stored === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
            var btn = document.getElementById('themeBtn');
            if (btn) {
                btn.addEventListener('click', function() {
                    var isDark = document.body.getAttribute('data-theme') === 'dark';
                    var next = isDark ? 'light' : 'dark';
                    document.body.setAttribute('data-theme', next);
                    localStorage.setItem('ecc-guide-theme', next);
                });
            }
        })();

        // ========== ACCOUNT FILTER LOGIC ==========
        // Global variables for convenience
        let currentProcessedData = [];
        const inputData = document.getElementById('input-data');
        const inputCount = document.getElementById('input-count');
        const outputList = document.getElementById('output-list');

        // Event Listener for automatic processing
        inputData.addEventListener('input', processData);

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        function processData() {
            const rawText = inputData.value;
            const lines = rawText.split('\n');
            
            outputList.innerHTML = '';
            currentProcessedData = [];
            let validCount = 0;

            if (rawText.trim() === '') {
                outputList.innerHTML = `
                    <div class="text-center text-slate-400 py-10 text-sm flex flex-col items-center gap-2">
                        <svg class="w-10 h-10 text-slate-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" /></svg>
                        Chưa có dữ liệu. Hãy dán dữ liệu vào ô bên trái.
                    </div>`;
                inputCount.textContent = "0 dòng";
                return;
            }

            const fragment = document.createDocumentFragment();

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine) return;

                const parts = cleanLine.split('|');
                
                if (parts.length >= 2) {
                    const user = parts[0].trim();
                    const pass = parts[1].trim();
                    
                    if (user && pass) {
                        currentProcessedData.push({ user, pass });
                        const safeUser = escapeHTML(user);
                        const safePass = escapeHTML(pass);
                        const rowId = `item-${validCount}`;

                        const div = document.createElement('div');
                        div.className = "bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm transition-all duration-300";
                        div.id = rowId;
                        div.dataset.userCopied = "false";
                        div.dataset.passCopied = "false";

                        div.innerHTML = `
                            <div class="flex flex-col md:flex-row gap-3">
                                <div class="flex-1 min-w-0 space-y-2">
                                    <div class="flex items-center justify-between bg-emerald-50/50 border border-emerald-100 p-2 rounded-lg hover:bg-emerald-50 transition-colors gap-2">
                                        <span class="text-xs font-semibold text-emerald-700 w-16 shrink-0">Tài khoản:</span>
                                        <span class="font-mono text-sm text-emerald-900 truncate flex-1" title="${safeUser}">${safeUser}</span>
                                        <button onclick="copySpecific('${safeUser.replace(/'/g, "\\'")}', this, '${rowId}', 'user')" class="shrink-0 text-xs bg-white border border-emerald-200 hover:bg-emerald-100 hover:border-emerald-300 text-emerald-700 py-1.5 px-3 rounded-md font-medium transition-colors flex items-center gap-1.5 shadow-sm active:scale-95">
                                            Chép TK
                                        </button>
                                    </div>
                                    <div class="flex items-center justify-between bg-rose-50/50 border border-rose-100 p-2 rounded-lg hover:bg-rose-50 transition-colors gap-2">
                                        <span class="text-xs font-semibold text-rose-700 w-16 shrink-0">Mật khẩu:</span>
                                        <span class="font-mono text-sm text-rose-900 truncate flex-1" title="${safePass}">${safePass}</span>
                                        <button onclick="copySpecific('${safePass.replace(/'/g, "\\'")}', this, '${rowId}', 'pass')" class="shrink-0 text-xs bg-white border border-rose-200 hover:bg-rose-100 hover:border-rose-300 text-rose-700 py-1.5 px-3 rounded-md font-medium transition-colors flex items-center gap-1.5 shadow-sm active:scale-95">
                                            Chép MK
                                        </button>
                                    </div>
                                </div>
                                <div class="flex items-center justify-center md:w-28 pt-2 md:pt-0 md:pl-4 md:border-l border-slate-100 shrink-0">
                                    <div class="status-indicator flex flex-row md:flex-col items-center justify-center gap-2">
                                        <span class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 status-icon transition-colors">
                                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                        </span>
                                        <span class="text-[11px] font-medium text-slate-500 status-text text-center transition-colors">Chưa xong</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        fragment.appendChild(div);
                        validCount++;
                    }
                }
            });

            if (validCount === 0 && rawText.trim() !== '') {
                outputList.innerHTML = `<div class="text-center text-red-400 py-4 text-sm">Không tìm thấy dữ liệu hợp lệ.</div>`;
            } else {
                outputList.appendChild(fragment);
            }
            
            inputCount.textContent = `${validCount} tài khoản`;
        }

        // Copy All formatted: user|pass
        function copyAllFormatted() {
            if (currentProcessedData.length === 0) {
                showToast("Không có dữ liệu để sao chép!", "error");
                return;
            }

            const textToCopy = currentProcessedData.map(item => `${item.user}|${item.pass}`).join('\n');
            const temp = document.createElement('textarea');
            temp.value = textToCopy;
            document.body.appendChild(temp);
            temp.select();
            
            try {
                document.execCommand('copy');
                showToast(`Đã chép tất cả ${currentProcessedData.length} tài khoản!`, "success");
                
                // Visual feedback for the "Copy All" button
                const btn = document.getElementById('btn-copy-all');
                const originalText = btn.innerHTML;
                btn.innerHTML = `
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                    Đã sao chép tất cả!
                `;
                btn.classList.replace('bg-indigo-600', 'bg-slate-800');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-slate-800', 'bg-indigo-600');
                }, 2000);
            } catch (err) {
                showToast("Lỗi sao chép!", "error");
            }
            document.body.removeChild(temp);
        }

        // Copy single element
        function copySpecific(text, button, rowId, type) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            
            try {
                document.execCommand('copy');
                showToast(`Đã chép ${type === 'user' ? 'Tài khoản' : 'Mật khẩu'}!`, "success");
            } catch (err) {
                showToast("Lỗi sao chép!", "error");
            }
            document.body.removeChild(temp);

            // UI feedback for button
            const originalText = button.textContent;
            button.textContent = 'Đã chép';
            button.classList.add('bg-slate-800', 'text-white', 'border-slate-800');
            
            setTimeout(() => {
                button.textContent = originalText;
                button.classList.remove('bg-slate-800', 'text-white', 'border-slate-800');
            }, 1500);

            // Handle completion indicator
            const row = document.getElementById(rowId);
            if (row) {
                if (type === 'user') row.dataset.userCopied = 'true';
                if (type === 'pass') row.dataset.passCopied = 'true';

                if (row.dataset.userCopied === 'true' && row.dataset.passCopied === 'true') {
                    row.classList.add('bg-green-50', 'border-green-300');
                    const icon = row.querySelector('.status-icon');
                    const textNode = row.querySelector('.status-text');
                    icon.classList.replace('bg-slate-100', 'bg-green-500');
                    icon.classList.replace('text-slate-400', 'text-white');
                    icon.innerHTML = `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
                    textNode.textContent = "Hoàn tất";
                    textNode.classList.replace('text-slate-500', 'text-green-700');
                    textNode.classList.add('font-bold');
                }
            }
        }

        // Toast System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-slate-800' : 'bg-red-600';
            
            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-white text-sm font-medium ${bgColor}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        processData();
    </script>
</body>
</html>
